[workspace]
resolver = "2"
members = [
    "crates/dev",
    "crates/devkey",
]
# Only build dev CLI by default (devkey is Windows-only)
default-members = ["crates/dev"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
