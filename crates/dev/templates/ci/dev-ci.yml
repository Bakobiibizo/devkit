# Generated by `dev ci install`. Regenerate with `dev ci install --force`.
# Runs the self-hosted runner's global `dev`; nothing is vendored into the repository.
name: dev ci

on:
  push:
    branches: [{{BRANCHES}}]
  pull_request:
    # ready_for_review: a draft marked ready is reviewed without needing a new commit.
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: dev-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dev-ci:
    name: dev ci
    runs-on: [{{RUNS_ON}}]
    # Self-hosted runners only run code from this repository, never from forks.
    if: >
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          # Keep the job token out of git config. Otherwise it overrides the runner's own
          # GitHub credentials for every git call in the checkout, and that token cannot
          # read other private repositories, such as git dependencies.
          persist-credentials: false
      - name: Show tool versions
        run: |
          command -v dev
          dev --version
      - name: dev ci
        run: dev ci
