[package]
name = "devkit-cli"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Config-driven developer workflow CLI for tasks, env files, git releases, setup, and project scaffolding"
repository = "https://github.com/bakobiibizo/devkit"
readme = "../../README.md"
keywords = ["cli", "devtools", "workflow", "scaffolding", "automation"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "dev"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
camino = "1.1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.5", features = ["derive"] }
rust-embed = "8.5"
globset = "0.4"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
toml_edit = "0.22"
dirs = "5.0"
semver = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[package.metadata.cargo-udeps.ignore]
normal = ["chrono", "serde_json"]

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.23"
